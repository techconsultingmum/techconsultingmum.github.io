name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

# Only one Pages build/deploy at a time; avoids duplicate artifacts from
# overlapping runs of the same workflow.
concurrency:
  group: github-pages-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      # Guards against "Multiple artifacts named github-pages" when a previous
      # attempt of this same run already uploaded one.
      - name: Remove stale github-pages artifacts from this run
        uses: geekyeggo/delete-artifact@v5
        with:
          name: github-pages
          failOnError: false

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: dist # Vite output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Smoke test production endpoints
        env:
          SITE_URL: https://agenticailab.in
        run: npm run smoke:test

      - name: Lighthouse production audit
        env:
          SITE_URL: https://agenticailab.in
          LIGHTHOUSE_MIN_PERFORMANCE: "0.70"
          LIGHTHOUSE_MIN_SEO: "0.90"
          LIGHTHOUSE_MAX_LCP_MS: "4000"
        run: npm run lighthouse:ci
